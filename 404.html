<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="notfound.title">Page not found — Moon Technologies</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#101633">
  <link rel="icon" type="image/svg+xml" href="/assets/img/mark.svg">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <style>
    .notfound { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: var(--gutter); }
    .notfound img { width: min(280px, 70vw); margin: 0 auto var(--space-5); }
    .notfound h1 { font-size: var(--step-3); margin: var(--space-3) 0; }
    .notfound p { color: var(--text-muted); margin-bottom: var(--space-6); }
  </style>
</head>
<body>
  <main class="notfound">
    <div>
      <img src="/assets/img/lino-sleeping.svg" width="640" height="640" alt="Lino the olinguito, asleep.">
      <p class="eyebrow">404</p>
      <h1 data-i18n="notfound.heading">Lino fell asleep here.</h1>
      <p data-i18n="notfound.body">This page doesn't exist — or it is still a new moon.</p>
      <a class="btn btn--primary" href="/" data-i18n="notfound.home">Back to the homepage</a>
    </div>
  </main>
  <script>
    // Tiny, dependency-free translation for this standalone page.
    (async () => {
      let lang = null;
      try { lang = localStorage.getItem("mt.lang"); } catch {}
      lang = lang || ((navigator.languages || [navigator.language])[0] || "en").slice(0, 2).toLowerCase();
      if (lang !== "es") return;
      const dict = await fetch("/assets/i18n/es.json").then((r) => r.json());
      document.documentElement.lang = "es";
      document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = dict[el.dataset.i18n] ?? el.textContent; });
    })().catch(() => {});
  </script>
</body>
</html>
