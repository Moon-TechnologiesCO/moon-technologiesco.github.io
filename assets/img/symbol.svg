<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="-320 -320 640 640">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#101633"/><stop offset="1" stop-color="#1F1752"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.45" stop-color="#FFE9A8" stop-opacity="0.30"/><stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lavhalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7F86FF" stop-opacity="0.35"/><stop offset="1" stop-color="#7F86FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8E7"/><stop offset="1" stop-color="#EADFC0"/>
    </linearGradient>
    <linearGradient id="earthshine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C8D2FF" stop-opacity="0.22"/><stop offset="1" stop-color="#C8D2FF" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F86FF"/><stop offset="1" stop-color="#9B5CFF"/>
    </linearGradient>
    <mask id="smile">
      <circle cx="0" cy="0" r="300" fill="#fff"/>
      <circle cx="0" cy="-128" r="300" fill="#000"/>
    </mask>
    <clipPath id="disc"><circle cx="0" cy="0" r="300"/></clipPath>
    <mask id="smilefront">
      <rect x="-320" y="40" width="640" height="300" fill="#fff"/>
      <circle cx="0" cy="-128" r="300" fill="#000"/>
    </mask>
  </defs>

    <g>
      <circle cx="0" cy="0" r="300" fill="url(#earthshine)"/>
      <g clip-path="url(#disc)" fill="#FFFFFF" fill-opacity="0.07">
        <circle cx="-118" cy="-120" r="46"/><circle cx="96" cy="-168" r="30"/><circle cx="150" cy="-40" r="22"/>
      </g>
      <circle cx="0" cy="0" r="297" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="6"/>
      <circle cx="0" cy="0" r="300" fill="url(#light)" mask="url(#smile)"/>
    </g>
</svg>
